<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POSITION</title>
    <style>
        .box1{
            position: absolute;
            bottom: 20px;
            width: 300px;
            height: 300px;
            background-color: aqua;
        } 
        .box2{
            position: absolute;
            width: 300px;
            height: 300px;
            background-color: rgb(4, 0, 255);
            top: 50%;
            left: 50%;
            bottom: 10px;
        }
        .box3{
            position: absolute;
            top: 30px;
            left: 30px;
            width: 300px;
            height: 300px;
            background-color: yellow;
        }
        .box4{
            position: absolute;
            top: 20px;
            right: 20px;
            width: 300px;
            height: 300px;
            background-color: red;
        }
        .box5{
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 300px;
            height: 300px;
            background-color: green;
        }
        .box6{
            position: absolute;
            width: 300px;
            height: 300px;
            top: 30%;
            right: 20px;
            background-color: azure;
        }
    </style>
</head>
<body>
    <div class="box1"></div>
    <div class="box2"></div>
    <div class="box3"></div>
    <div class="box4"></div>
    <div class="box5"></div>
    <div class="box6"></div>
    <div class="box7"></div>
</body>
</html>
