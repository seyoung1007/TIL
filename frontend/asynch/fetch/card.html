<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }

      ul,
      li {
        list-style: none;
      }
      a {
        text-decoration: none;
        color: #333;
      }
      img {
        display: block;
        width: 100%;
      }
      .menu {
        width: 70%;
        margin: 100px auto;
        display: flex;
        background-color: aquamarine;
      }
      .menu-item {
        flex: 1;
        text-align: center;
        padding: 10px;
        cursor: pointer;
        background-color: #f0f0f0;
      }
      .menu-item:hover,
      .menu-item.active {
        background-color: #333;
        color: #fff;
      }
      .card-container {
        width: 80%;
        margin: auto;
      }
      .card {
        /* display: flex; */
        display: none;
        gap: 10px;
        padding: 20px;
        border: 1px solid #ccc;
      }
      .card.active {
        display: flex;
      }
      .card li {
        flex: 1;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="menu">
      <div class="menu-item">메뉴 1</div>
      <div class="menu-item">메뉴 2</div>
      <div class="menu-item">메뉴 3</div>
    </div>
    <div class="card-container">
      <!-- js출력 -->
    </div>
    <script>
      const cardContainer = document.querySelector(".card-container");
      // json정보 가져오기
      fetch("cardData.json")
        .then((response) => {
          return response.json();
        })
        .then((cardData) => {
          //   console.log(cardData);
          cardData.forEach((menu, index) => {
            console.log(menu, index);
            const cardList = document.createElement("ul");
            console.log(cardList);
            cardList.classList.add("card");
            menu.forEach((card) => {
              const cardItem = document.createElement("li");
              // console.log(cardItem);
              cardItem.innerHTML = `
                 <img src="${card.imageSrc}" alt="${card.description}">
                 <h2>설명:${card.description}</h2>
                 <p>가격:${card.price}</p>
                `;
              cardList.appendChild(cardItem);
            });
            cardContainer.appendChild(cardList);
          });
          // 탭버튼 클릭시
          const menuItem = document.querySelectorAll(".menu-item");
          menuItem.forEach((menuI, index) => {
            // console.log(menuItem, index);
            menuI.addEventListener("click", () => {
              showCard(index);
            });
          });
          //   보여지는 함수
          function showCard(index) {
            // console.log(index);
            const cards = document.querySelectorAll(".card");
            const menuItems = document.querySelectorAll(".menu-item");
            cards.forEach((card, i) =>{
              card.classList.toggle("active" , i === index)
            })
            menuItems.forEach((menuItem , i) =>{
              menuItem.classList.toggle("active" , i === index)
            })
          }
          // 첫화면 보여주기 
          showCard(0)
        })
        .catch((error) => {
          console.log(error);
        });
    </script>
  </body>
</html>
