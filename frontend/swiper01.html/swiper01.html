<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- Link Swiper's CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"
    />
    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
    <link rel="stylesheet" href="css/swiper-1.css" />
    <script src="js/swiper-1.js"></script>
  </head>
  <body>
    <!-- swiper -->
    <div class="visual">
      <div class="swiper visual-sw">
        <div class="swiper-wrapper">
          <div class="swiper-slide">
            <img src="images/sw_01.png" alt="img1" />
          </div>
          <div class="swiper-slide">
            <img src="images/sw_02.png" alt="img1" />
          </div>
          <div class="swiper-slide">
            <img src="images/sw_03.png" alt="img1" />
          </div>
        </div>
        <!-- <div class="swiper-button-next"></div>
        <div class="swiper-button-prev"></div> -->
        <!-- 네비게이션 커스텀 -->
         <button class="custom-prev">◀</button>
         <button class="custom-next">▶</button>
        <div class="swiper-pagination"></div>
      </div>
    </div>
    <!-- product-list -->
     <div class="product-list inner">
        <div class="swiper-slide">
            <img src="images/about-03-1.png" alt="">
            <div class="item-swiper-txt">
                <p>상품설명 1</p>
                <p>가격 : 2,000원</p>
            </div>
        <div class="swiper-slide">
            <img src="images/about-05-1.png" alt="">
            <div class="item-swiper-txt">
                <p>상품설명 1</p>
                <p>가격 : 2,000원</p>
            </div>
        <div class="swiper-slide">
            <img src="images/about-08-2.png" alt="">
            <div class="item-swiper-txt">
                <p>상품설명 1</p>
                <p>가격 : 2,000원</p>
            </div>
        </div>
     </div>
  </body>
</html>
